name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
          brew update
          brew install create-dmg

      - name: PyInstaller 打包
        run: |
          pyinstaller --name VoiceAnalysisApp --windowed run_app.py
          echo "=== dist 目录内容 ==="
          ls -la dist/

      - name: 封装 DMG
        run: |
          mkdir -p dmg_temp
          cp -R dist/VoiceAnalysisApp.app dmg_temp/
          create-dmg \
            --volname "VoiceAnalysis" \
            --window-size 800 600 \
            --icon-size 128 \
            --icon "VoiceAnalysisApp.app" 200 250 \
            --icon "/Applications" 600 250 \
            --app-drop-link 400 450 \
            VoiceAnalysisTool.dmg \
            dmg_temp/

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAnalysisTool-dmg
          path: VoiceAnalysisTool.dmg
