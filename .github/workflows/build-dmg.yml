name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 清理可能的污染配置
        run: |
          rm -f ~/Library/Application\ Support/pip/pip.conf ~/.config/pip/pip.conf ~/.pip/pip.conf /etc/pip.conf 2>/dev/null || true
          echo "=== pip config ==="
          pip config list || true

      - name: 安装依赖
        run: |
          pip install --upgrade pip

          # 1) 优先：从官方 API 直取 whl 地址（绕过索引）
          python3 << 'PY'
          import sys, json, urllib.request
          try:
              raw = urllib.request.urlopen("https://pypi.org/pypi/praat-parselmouth/0.11.4/json", timeout=20).read()
              data = json.loads(raw)
              urls = data.get("urls") or data.get("releases", {}).get("0.11.4", [])
              for f in urls:
                  nm = f.get("filename", "")
                  if "macosx" in nm and "arm64" in nm and "cp311" in nm:
                      print(f["url"]); sys.exit(0)
              # 没命中 arm64 就取任意 cp311/universal/any
              for f in urls:
                  nm = f.get("filename", "")
                  if "cp311" in nm or "py3-none-any" in nm or "universal2" in nm:
                      print(f["url"]); sys.exit(0)
              print("NO_WHEEL", file=sys.stderr); sys.exit(1)
          except Exception as e:
              print("RAW:", repr(raw[:300]) if 'raw' in dir() else e, file=sys.stderr)
              sys.exit(2)
          PY

          WHEEL=$(python3 << 'PY'
          import sys, json, urllib.request
          raw = urllib.request.urlopen("https://pypi.org/pypi/praat-parselmouth/0.11.4/json", timeout=20).read()
          data = json.loads(raw)
          urls = data.get("urls") or data.get("releases", {}).get("0.11.4", [])
          for f in urls:
              nm = f.get("filename", "")
              if "macosx" in nm and "arm64" in nm and "cp311" in nm:
                  print(f["url"]); sys.exit(0)
          for f in urls:
              nm = f.get("filename", "")
              if "cp311" in nm or "py3-none-any" in nm or "universal2" in nm:
                  print(f["url"]); sys.exit(0)
          sys.exit(1)
          PY
          )
          echo "wheel = $WHEEL"
          if [ -z "$WHEEL" ] || [ "$WHEEL" = "NO_WHEEL" ]; then
            echo "无法解析 whl 地址，走兜底方案"
            pip download --dest /tmp/wheel --no-deps -i https://pypi.org/simple --trusted-host pypi.org praat-parselmouth==0.11.4 || true
            WHEEL=$(ls /tmp/wheel/*.whl 2>/dev/null | head -1)
          fi
          if [ -n "$WHEEL" ]; then pip install "$WHEEL"; else echo "兜底也失败"; exit 1; fi

          # 2) 其余包正常装（不再碰 parselmouth）
          pip install -i https://pypi.org/simple --trusted-host pypi.org \
            streamlit numpy pandas matplotlib textgrid audio-recorder-streamlit Pillow pyinstaller pillow

      - name: PyInstaller 打包
        run: |
          pyinstaller --name VoiceAnalysisApp --windowed --clean --noconfirm run_app.py
          ls -la dist/

      - name: 封装 DMG
        run: |
          rm -rf dmg_root && mkdir -p dmg_root
          cp -R dist/VoiceAnalysisApp.app dmg_root/
          hdiutil create -volname "VoiceAnalysisTool" -srcfolder dmg_root -ov -format UDZO VoiceAnalysisTool.dmg
          ls -lh VoiceAnalysisTool.dmg

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAnalysisTool-macOS
          path: VoiceAnalysisTool.dmg
