name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip config unset global.index-url global.extra-index-url
          pip install --upgrade pip -i https://pypi.org/simple
          pip install -i https://pypi.org/simple \
            --index-url https://pypi.org/simple \
            streamlit \
            praat-parselmouth==0.11.4 \
            numpy pandas matplotlib textgrid audio-recorder-streamlit \
            Pillow pyinstaller pillow

      - name: PyInstaller 打包
        run: |
          pyinstaller --name VoiceAnalysisApp --windowed --clean --noconfirm run_app.py
          ls -la dist/

      - name: 封装 DMG
        run: |
          rm -rf dmg_root && mkdir -p dmg_root
          cp -R dist/VoiceAnalysisApp.app dmg_root/
          hdiutil create \
            -volname "VoiceAnalysisTool" \
            -srcfolder dmg_root \
            -ov -format UDZO \
            VoiceAnalysisTool.dmg
          ls -lh VoiceAnalysisTool.dmg

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAnalysisTool-macOS
          path: VoiceAnalysisTool.dmg
