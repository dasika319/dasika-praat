name: Build macOS DMG

on:
  workflow_dispatch:
    push:
      branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 清理可能的污染配置
        run: |
          rm -f ~/Library/Application\ Support/pip/pip.conf ~/.config/pip/pip.conf ~/.pip/pip.conf 2>/dev/null || true
          pip config list || true

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          # 从官方 API 拿真实 whl 地址，彻底绕过被污染的索引
          WHEEL=$(curl -sL https://pypi.org/pypi/praat-parselmouth/0.11.4/json | python3 -c "import sys,json; urls=[f['url'] for f in json.load(sys.stdin)['urls'] if 'macosx' in f['filename'] and 'arm64' in f['filename'] and 'cp311' in f['filename']]; print(urls[0] if urls else '')")
          echo "parsemouth wheel = $WHEEL"
          if [ -z "$WHEEL" ]; then echo "取不到 whl 地址"; exit 1; fi
          pip install "$WHEEL"
          pip install -i https://pypi.org/simple --trusted-host pypi.org \
            streamlit numpy pandas matplotlib textgrid audio-recorder-streamlit Pillow pyinstaller pillow

      - name: PyInstaller 打包
        run: |
          pyinstaller --name VoiceAnalysisApp --windowed --clean --noconfirm run_app.py
          ls -la dist/

      - name: 封装 DMG
        run: |
          rm -rf dmg_root && mkdir -p dmg_root
          cp -R dist/VoiceAnalysisApp.app dmg_root/
          hdiutil create \
            -volname "VoiceAnalysisTool" \
            -srcfolder dmg_root \
            -ov -format UDZO \
            VoiceAnalysisTool.dmg
          ls -lh VoiceAnalysisTool.dmg

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAnalysisTool-macOS
          path: VoiceAnalysisTool.dmg
