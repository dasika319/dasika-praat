name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    env:
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ""
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 诊断源配置
        run: |
          echo "=== pip config ==="
          pip config list || true
          echo "=== praat-parselmouth 可用版本 ==="
          pip index versions praat-parselmouth || pip install praat-parselmouth==999999 2>&1 | grep -i "from versions" || true

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install \
            streamlit \
            praat-parselmouth==0.11.4 \
            numpy pandas matplotlib textgrid audio-recorder-streamlit \
            Pillow pyinstaller pillow

      - name: PyInstaller 打包
        run: |
          pyinstaller --name VoiceAnalysisApp --windowed --clean --noconfirm run_app.py
          ls -la dist/

      - name: 封装 DMG
        run: |
          rm -rf dmg_root && mkdir -p dmg_root
          cp -R dist/VoiceAnalysisApp.app dmg_root/
          hdiutil create \
            -volname "VoiceAnalysisTool" \
            -srcfolder dmg_root \
            -ov -format UDZO \
            VoiceAnalysisTool.dmg
          ls -lh VoiceAnalysisTool.dmg

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAnalysisTool-macOS
          path: VoiceAnalysisTool.dmg
