name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: PyInstaller 打包
        run: |
          pyinstaller --name "VoiceAnalysisApp" --windowed --onefile run_app.py
          echo "=== dist 目录内容 ==="
          ls -la dist/

      - name: 封装 DMG (hdiutil)
        run: |
          rm -rf dmg_root
          mkdir -p dmg_root
          cp -R dist/VoiceAnalysisApp.app dmg_root/

          rm -f VoiceAnalysisTool.dmg
          hdiutil create \
            -volname "VoiceAnalysisApp" \
            -srcfolder dmg_root \
            -ov \
            -format UDZO \
            VoiceAnalysisTool.dmg

          echo "=== 生成结果 ==="
          ls -lh VoiceAnalysisTool.dmg

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAnalysisTool-macOS
          path: VoiceAnalysisTool.dmg
